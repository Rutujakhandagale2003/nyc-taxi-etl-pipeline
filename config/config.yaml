# ---------- Project paths ----------
paths:
  raw: data/raw              # files exactly as downloaded
  staging: data/staging      # cleaned / transformed files
  warehouse: data/warehouse  # DuckDB database lives here
  quality: data/quality
  logs: logs

# ---------- Data sources ----------
sources:
  trips_base_url: https://d37ci6vzurychx.cloudfront.net/trip-data
  taxi_type: yellow
  zone_lookup_url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
  weather_api_url: https://archive-api.open-meteo.com/v1/archive

# ---------- Which months to process ----------
pipeline:
  months:
    - "2024-01"
    - "2024-02"

# ---------- Weather (New York City) ----------
weather:
  latitude: 40.7128
  longitude: -74.0060
  timezone: America/New_York
  daily_variables:
    - temperature_2m_max
    - temperature_2m_min
    - temperature_2m_mean
    - precipitation_sum
    - rain_sum
    - snowfall_sum
    - wind_speed_10m_max
  heavy_rain_mm: 10      # precipitation above this = heavy rain day

# ---------- Data cleaning rules ----------
cleaning:
  min_trip_distance: 0.1          # miles
  max_trip_distance: 100
  max_fare: 500
  max_trip_duration_minutes: 300
  max_passenger_count: 6
  valid_rate_codes: [1, 2, 3, 4, 5, 6]

# ---------- Warehouse ----------
warehouse:
  db_file: nyc_taxi.duckdb


# ---------- Data quality thresholds ----------
quality:
  min_rows_per_month: 1000000
  max_avg_speed_mph: 80